name: Publicar release

# Se activa al publicar una etiqueta de versión, por ejemplo v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 1-3. Descarga el código, ejecuta pruebas y go vet.
  pruebas:
    name: Pruebas y verificación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: gofmt + go vet + pruebas
        working-directory: Sky-tauri
        run: make verificar

  # 4-5. Compila los binarios y genera los checksums.
  binarios:
    name: Compilar binarios
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Compilar todas las plataformas
        working-directory: Sky-tauri
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          export VERSION="${VERSION#v}"
          export FECHA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make compilar-todas-plataformas
      - name: Prueba de humo del binario de Linux
        run: ./Sky-tauri/dist/skynative-linux-amd64 --version
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: binarios
          path: Sky-tauri/dist/

  # 6-7. Publica la release con los artefactos y los instaladores.
  publicar:
    name: Publicar release
    needs: binarios
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Descargar los binarios
        uses: actions/download-artifact@v4
        with:
          name: binarios
          path: dist
      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
            scripts/desinstalar.sh
            scripts/desinstalar.ps1
          generate_release_notes: true
          fail_on_unmatched_files: true
